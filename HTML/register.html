<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Register</title> 
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/register_style.css"> 
</head> 
<body> 
  <main class="page"> 
    <section class="card"> 
      <h1>Register</h1> 
      <form class="register-form" action="#" method="post" enctype="multipart/form-data"> 
        
        <div class="row"> 
          <label for="username">Username</label> 
          <input type="text" id="username" name="username" placeholder="ex: ioanaTW" required> 
        </div> 

        <div class="row"> 
          <label for="email">Email</label> 
          <input type="email" id="email" name="email" placeholder="email@gmail.com" required> 
        </div> 

        <div class="row two-col"> 
          <div> 
            <label for="password">Password</label> 
            <input type="password" id="password" name="password" required> 
          </div> 
          <div> 
            <label for="confirm_password">Confirm password</label> 
            <input type="password" id="confirm_password" name="confirm_password" required> 
          </div> 
        </div> 

        <div class="row"> 
          <label>Gender</label> 
          <div class="radio-group"> 
            <label><input type="radio" name="gender" value="male"> Male</label> 
            <label><input type="radio" name="gender" value="female"> Female</label> 
            <label><input type="radio" name="gender" value="other"> Other</label> 
          </div> 
        </div> 

        <div class="row"> 
          <label for="profile_picture">Profile picture</label> 
          <input type="file" id="profile_picture" name="profile_picture" accept="image/*"> 
        </div> 

        <div class="row"> 
          <label for="description">Short description</label> 
          <textarea id="description" name="description" rows="3" placeholder="Tell us a bit about yourself..."></textarea> 
        </div> 

        <div class="actions"> 
          <button type="submit" class="btn primary">Confirm account</button> 
          <button type="reset" class="btn ghost">Reset</button> 
        </div> 

        <p class="login-link"> 
          Already have an account? <a href="../HTML/login.html">Login</a>
        </p> 
      </form> 
    </section> 
  </main> 
</body> 
</html>
